<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema UGC</title>
<link rel="icon" type="image/png" href="./logo.png">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}

.login-container {
background: white;
border-radius: 15px;
box-shadow: 0 12px 48px rgba(0,0,0,0.4);
max-width: 450px;
width: 100%;
overflow: hidden;
animation: slideIn 0.3s ease;
}

@keyframes slideIn {
from {
transform: translateY(-50px);
opacity: 0;
}
to {
transform: translateY(0);
opacity: 1;
}
}

.login-header {
background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
color: white;
padding: 40px 30px;
text-align: center;
}

.login-header img {
width: 80px;
height: 80px;
margin-bottom: 15px;
}

.login-header h1 {
font-size: 1.8em;
margin-bottom: 5px;
}

.login-header p {
color: #4a9eff;
font-size: 0.95em;
}

.login-body {
padding: 40px 30px;
}

.alert {
padding: 15px 20px;
border-radius: 8px;
margin-bottom: 20px;
display: none;
animation: shake 0.3s;
}

@keyframes shake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-10px); }
75% { transform: translateX(10px); }
}

.alert-error {
background: #f8d7da;
color: #721c24;
border-left: 4px solid #dc2626;
}

.alert-success {
background: #d4edda;
color: #155724;
border-left: 4px solid #28a745;
}

.form-group {
margin-bottom: 25px;
}

.form-group label {
display: block;
margin-bottom: 8px;
color: #000000;
font-weight: 600;
font-size: 0.95em;
}

.form-group input {
width: 100%;
padding: 12px;
border: 2px solid #ddd;
border-radius: 8px;
font-size: 1em;
transition: all 0.3s;
font-family: inherit;
}

.form-group input:focus {
outline: none;
border-color: #2a5298;
box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
}

.password-container {
position: relative;
}

.toggle-password {
position: absolute;
right: 15px;
top: 50%;
transform: translateY(-50%);
cursor: pointer;
color: #666;
font-size: 1.2em;
user-select: none;
transition: color 0.3s;
}

.toggle-password:hover {
color: #2a5298;
}

.btn-login {
width: 100%;
padding: 12px 30px;
background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
color: white;
border: none;
border-radius: 8px;
font-size: 1em;
font-weight: 600;
cursor: pointer;
transition: all 0.3s;
margin-top: 10px;
}

.btn-login:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(42,82,152,0.4);
}

.btn-login:active {
transform: translateY(0);
}

.btn-login:disabled {
background: #9ca3af;
cursor: not-allowed;
transform: none;
box-shadow: none;
}

.login-footer {
text-align: center;
padding: 20px;
background: #f8f9fa;
border-top: 1px solid #eee;
}

.login-footer p {
color: #666;
font-size: 0.85em;
}

.login-footer p:first-child {
color: #000000;
font-weight: 600;
}

.loading {
display: inline-block;
width: 20px;
height: 20px;
border: 3px solid rgba(255,255,255,.3);
border-radius: 50%;
border-top-color: white;
animation: spin 0.8s linear infinite;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
.login-header {
padding: 30px 20px;
}

.login-header h1 {
font-size: 1.5em;
}

.login-body {
padding: 30px 20px;
}
}
</style>
</head>
<body>

<div class="login-container">
<div class="login-header">
<img src="./logo.png" alt="Logo CENSA" onerror="this.style.display='none'">
<h1>Inicio de Sesión</h1>
<p>Sistema de Gestión de Convivencia</p>
</div>

<div class="login-body">
<div class="alert alert-error" id="alertError">
<strong>❌ Error:</strong> <span id="errorMessage"></span>
</div>

<div class="alert alert-success" id="alertSuccess">
<strong>✅ Acceso concedido</strong>
</div>

<form id="loginForm">
<div class="form-group">
<label for="usuario">👤 Usuario</label>
<input 
type="text" 
id="usuario" 
placeholder="Ingrese su usuario"
required
autocomplete="username"
>
</div>

<div class="form-group">
<label for="password">🔑 Contraseña</label>
<div class="password-container">
<input 
type="password" 
id="password" 
placeholder="Ingrese su contraseña"
required
autocomplete="current-password"
>
<span class="toggle-password" onclick="togglePassword()">👁️</span>
</div>
</div>

<button type="submit" class="btn-login" id="btnLogin">
Iniciar Sesión
</button>
</form>
</div>

<div class="login-footer">
<p>© 2026 Politécnico Nuestra Sra. De la Altagracia</p>
<p style="margin-top: 5px; font-size: 0.8em;">Unidad de Gestión de Convivencia</p>
</div>
</div>

<script>
// ==========================================
// CARGA DE USUARIOS DESDE LA BASE DE DATOS UNIFICADA
// (mismo Apps Script que usa el resto del sistema, hoja "Usuarios")
// ==========================================

// Script principal del sistema + la hoja de Usuarios
const URL_USUARIOS = 'https://script.google.com/macros/s/AKfycbxzxH-mSiQnYZAADC7JLwnfbYvKYwNyOje1Tje77PP8u9Gv_ksx_CEk0J8R1e1fHiTM/exec?hoja=Usuarios';

let USUARIOS_CACHE = null;

// Lee los usuarios de la hoja. Lanza error si no se pueden cargar
// (ya NO hay contraseñas de respaldo en el código).
async function cargarUsuarios() {
  console.log('📥 Cargando usuarios desde la base de datos...');
  const response = await fetch(URL_USUARIOS);
  if (!response.ok) throw new Error('No se pudo conectar con la base de datos de usuarios');

  let data = await response.json();

  // El script puede devolver el arreglo directo o envuelto en {data:[...]}
  if (data && !Array.isArray(data) && Array.isArray(data.data)) data = data.data;
  if (!Array.isArray(data)) throw new Error('La respuesta de usuarios no es válida');

  const usuariosObj = {};
  data.forEach(function (user) {
    const username = String(user.Usuario || user.usuario || user.USUARIO || '').trim();
    const password = String(user['Contraseña'] || user.contraseña || user.password || user.Password || '').trim();
    const nombreCompleto = user['Nombre Completo'] || user.Nombre || user.nombre || '';
    const cargo = user.Cargo || user.cargo || '';
    const tipo = String(user.Tipo || user.tipo || user.Rol || user.rol || '').trim().toLowerCase();

    if (username) {
      usuariosObj[username.toLowerCase()] = {
        password: password,
        rol: tipo,
        nombre: nombreCompleto,
        cargo: cargo
      };
    }
  });

  console.log('✅ Usuarios cargados:', Object.keys(usuariosObj).length);
  USUARIOS_CACHE = usuariosObj;
  return usuariosObj;
}

// ==========================================
// FUNCIÓN DE LOGIN
// ==========================================

document.getElementById('loginForm').addEventListener('submit', async function(e) {
e.preventDefault();

const usuario = document.getElementById('usuario').value.trim().toLowerCase();
const password = document.getElementById('password').value.trim();

const btnLogin = document.getElementById('btnLogin');
const alertError = document.getElementById('alertError');
const alertSuccess = document.getElementById('alertSuccess');

alertError.style.display = 'none';
alertSuccess.style.display = 'none';

if (!usuario || !password) {
mostrarError('Por favor complete todos los campos');
return;
}

btnLogin.disabled = true;
btnLogin.innerHTML = '<span class="loading"></span> Verificando...';

try {
// Cargar usuarios desde la base de datos
const USUARIOS = await cargarUsuarios();

if (!USUARIOS[usuario]) {
mostrarError('Usuario no encontrado');
btnLogin.disabled = false;
btnLogin.innerHTML = 'Iniciar Sesión';
return;
}

if (String(USUARIOS[usuario].password).trim() !== String(password).trim()) {
mostrarError('Contraseña incorrecta');
btnLogin.disabled = false;
btnLogin.innerHTML = 'Iniciar Sesión';
return;
}

const datosUsuario = {
usuario: usuario,
rol: USUARIOS[usuario].rol,
nombre: USUARIOS[usuario].nombre,
cargo: USUARIOS[usuario].cargo,
loginTime: new Date().toISOString()
};

localStorage.setItem('usuarioUGC', JSON.stringify(datosUsuario));

alertSuccess.style.display = 'block';
btnLogin.innerHTML = '✅ Acceso concedido';

console.log('✅ Login exitoso:', datosUsuario);

setTimeout(() => {
if (datosUsuario.rol === 'administrador') {
window.location.href = 'admin.html';
} else if (datosUsuario.rol === 'consulta') {
window.location.href = 'consulta.html';
} else {
mostrarError('Tu usuario no tiene un rol válido (revisa la columna "Tipo" en la hoja: debe decir "administrador" o "consulta").');
btnLogin.disabled = false;
btnLogin.innerHTML = 'Iniciar Sesión';
}
}, 1000);

} catch (error) {
console.error('❌ Error en login:', error);
mostrarError('No se pudieron cargar los usuarios. Revisa tu conexión e inténtalo de nuevo.');
btnLogin.disabled = false;
btnLogin.innerHTML = 'Iniciar Sesión';
}
});

// ==========================================
// FUNCIONES AUXILIARES
// ==========================================

function mostrarError(mensaje) {
const alertError = document.getElementById('alertError');
document.getElementById('errorMessage').textContent = mensaje;
alertError.style.display = 'block';
}

function togglePassword() {
const passwordInput = document.getElementById('password');
const toggleIcon = document.querySelector('.toggle-password');

if (passwordInput.type === 'password') {
passwordInput.type = 'text';
toggleIcon.textContent = '🙈';
} else {
passwordInput.type = 'password';
toggleIcon.textContent = '👁️';
}
}

window.addEventListener('load', function() {
const sesionActiva = localStorage.getItem('usuarioUGC');
if (sesionActiva) {
const usuario = JSON.parse(sesionActiva);
console.log('⚠️ Ya hay una sesión activa:', usuario);
}
});

document.getElementById('password').addEventListener('keypress', function(e) {
if (e.key === 'Enter') {
document.getElementById('loginForm').dispatchEvent(new Event('submit'));
}
});

console.log('🔐 Sistema de login cargado');
</script>

</body>
</html>
